<style>
  :root {
    --bg: #14181C;
    --panel: #1C2126;
    --panel-2: #232930;
    --panel-3: #2A3139;
    --line: #303840;
    --text: #ECE9E2;
    --text-dim: #93A0AB;
    --ok: #7FBF5F;
    --warn: #D9A441;
    --bad: #C1524C;
    --accent: #E7B44A;
    --progress: #4FA8D8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 48px; }

  header.top {
    padding: 22px 18px 14px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
  }
  header.top h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto; }
  .brand h1 { margin: 0; }
  header.top .sub { color: var(--text-dim); font-size: 13px; }
  .overall-bar { margin-top: 12px; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .overall-bar > div { height: 100%; background: var(--accent); transition: width .3s ease; }

  nav.levels {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    position: sticky; top: 76px; z-index: 19; background: var(--bg);
    scrollbar-width: thin;
  }
  nav.levels button {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel);
    color: var(--text-dim); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  nav.levels button .dot { width: 8px; height: 8px; border-radius: 50%; }
  nav.levels button.active { color: var(--text); border-color: var(--dotcolor, var(--accent)); background: var(--panel-2); }

  main { padding: 16px 18px 40px; max-width: 860px; margin: 0 auto; }

  .level-progress {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; color: var(--text-dim); font-size: 13px;
  }
  .level-progress b { color: var(--text); font-weight: 700; }

  .group-title { font-size: 12px; color: var(--text-dim); margin: 22px 0 8px; padding-left: 2px; }
  .group-title:first-of-type { margin-top: 4px; }

  .ex-row {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--rowcolor, var(--line));
    border-radius: 8px; margin-bottom: 8px; overflow: hidden;
  }
  .ex-main {
    display: grid; grid-template-columns: 30px 1fr auto;
    align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer;
  }
  .ex-icon {
    width: 26px; height: 26px; stroke: var(--text-dim); stroke-width: 6;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .ex-text { font-size: 14px; line-height: 1.3; }
  .ex-target { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .ex-target b { color: var(--text); font-weight: 600; }

  .status-pill {
    font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    white-space: nowrap; min-width: 58px; text-align: center;
  }
  .status-pill.empty { background: var(--panel-2); color: var(--text-dim); }
  .status-pill.yes { background: rgba(127,191,95,0.18); color: var(--ok); }
  .status-pill.not-yet { background: rgba(217,164,65,0.18); color: var(--warn); }
  .status-pill.bad { background: rgba(193,82,76,0.18); color: var(--bad); }
  .status-pill.progress { background: rgba(79,168,216,0.18); color: var(--progress); }
  .assisted-best { color: var(--progress); }
  .h-tag {
    background: rgba(217,164,65,0.18); color: var(--warn);
    font-size: 10.5px; font-weight: 700; padding: 2px 7px;
    border-radius: 999px; flex: 0 0 auto; white-space: nowrap;
  }

  .ex-controls { display: flex; align-items: center; gap: 8px; }
  .ex-caret { color: var(--text-dim); font-size: 12px; transition: transform .15s ease; }
  .ex-row.open .ex-caret { transform: rotate(180deg); }

  .ex-more { display: none; padding: 4px 12px 14px 52px; }
  .ex-row.open .ex-more { display: block; }

  .log-form {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; margin-bottom: 10px;
  }
  .log-field { display: flex; flex-direction: column; gap: 3px; }
  .log-field label { font-size: 10.5px; color: var(--text-dim); }
  .log-field input {
    background: var(--panel-3); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 7px; font-size: 13px;
  }
  .log-field.value input { width: 64px; }
  .log-field.date input { width: 130px; }
  .log-field.notes { flex: 1; min-width: 120px; }
  .log-form button {
    background: var(--accent); border: none; color: #1C2126; font-weight: 700;
    font-size: 13px; padding: 7px 14px; border-radius: 6px; cursor: pointer;
  }

  .history-title { font-size: 11px; color: var(--text-dim); margin: 4px 0 6px; }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-empty { font-size: 12.5px; color: var(--text-dim); padding: 4px 0; }
  .history-item {
    display: grid; grid-template-columns: 84px 50px 1fr auto;
    align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; font-size: 12.5px;
  }
  .history-item .h-date { color: var(--text-dim); }
  .history-item .h-val { font-weight: 700; }
  .history-item .h-notes {
    color: var(--text-dim); overflow: hidden;
    display: flex; align-items: center; gap: 6px;
  }
  .history-item .h-notes .h-notes-text {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .log-field.assisted { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 6px; }
  .log-field.assisted input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .log-field.assisted label { margin: 0; font-size: 12.5px; color: var(--text); }
  .history-item .h-best { color: var(--ok); font-weight: 700; }
  .history-item button {
    background: none; border: none; color: var(--text-dim);
    font-size: 14px; cursor: pointer; padding: 2px 4px;
  }
  .history-item button:hover { color: var(--bad); }

  footer.bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; gap: 8px; padding: 8px 14px; justify-content: center;
  }
  footer.bar button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim);
    font-size: 12px; padding: 8px 12px; border-radius: 7px; cursor: pointer;
  }
  footer.bar button:hover { color: var(--text); }
  #fileInput { display: none; }
</style>
</head>

  lever: `<svg viewBox="0 0 100 100" class="ex-icon"><line x1="8" y1="16" x2="92" y2="16"/><circle cx="20" cy="26" r="9"/><line x1="20" y1="24" x2="20" y2="16"/><line x1="20" y1="30" x2="86" y2="52"/><line x1="86" y1="52" x2="94" y2="58"/></svg>`,
  planche: `<svg viewBox="0 0 100 100" class="ex-icon"><line x1="8" y1="88" x2="92" y2="88"/><circle cx="18" cy="62" r="9"/><line x1="20" y1="70" x2="20" y2="88"/><line x1="20" y1="66" x2="90" y2="42"/><line x1="90" y1="42" x2="96" y2="48"/></svg>`,
  flag: `<svg viewBox="0 0 100 100" class="ex-icon"><line x1="48" y1="4" x2="48" y2="94"/><circle cx="55" cy="24" r="9"/><line x1="55" y1="28" x2="48" y2="14"/><line x1="55" y1="32" x2="48" y2="48"/><line x1="61" y1="34" x2="92" y2="20"/><line x1="92" y1="20" x2="98" y2="14"/></svg>`,
  hold: `<svg viewBox="0 0 100 100" class="ex-icon"><circle cx="20" cy="30" r="9"/><line x1="22" y1="40" x2="22" y2="62"/><line x1="22" y1="62" x2="14" y2="68"/><line x1="22" y1="48" x2="76" y2="54"/><line x1="14" y1="70" x2="80" y2="70"/></svg>`,
  rings: `<svg viewBox="0 0 100 100" class="ex-icon"><line x1="30" y1="4" x2="30" y2="24"/><line x1="70" y1="4" x2="70" y2="24"/><circle cx="30" cy="32" r="9"/><circle cx="70" cy="32" r="9"/><circle cx="50" cy="42" r="8"/><line x1="50" y1="50" x2="30" y2="26"/><line x1="50" y1="50" x2="70" y2="26"/><line x1="50" y1="50" x2="50" y2="78"/><line x1="50" y1="78" x2="40" y2="92"/><line x1="50" y1="78" x2="60" y2="92"/></svg>`,
  core: `<svg viewBox="0 0 100 100" class="ex-icon"><circle cx="16" cy="22" r="9"/><line x1="20" y1="30" x2="46" y2="48"/><line x1="46" y1="48" x2="78" y2="58"/><circle cx="84" cy="58" r="10"/><line x1="20" y1="30" x2="24" y2="56"/><line x1="24" y1="56" x2="38" y2="62"/></svg>`,
  generic: `<svg viewBox="0 0 100 100" class="ex-icon"><circle cx="50" cy="16" r="9"/><line x1="50" y1="25" x2="50" y2="58"/><line x1="50" y1="34" x2="28" y2="48"/><line x1="50" y1="34" x2="72" y2="48"/><line x1="50" y1="58" x2="36" y2="90"/><line x1="50" y1="58" x2="64" y2="90"/></svg>`
};

const STORAGE_KEY = "calisthenics_tracker_v2";
const OLD_STORAGE_KEY = "calisthenics_tracker_v1";

let state = {};
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    state = JSON.parse(raw) || {};
  } else {
    // migrate v1 (single best/date/notes) if present
    const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
    if (oldRaw) {
      const old = JSON.parse(oldRaw) || {};
      state = migrateOldState(old);
      saveState();
    }
  }
} catch (e) { state = {}; }

function migrateOldState(old) {
  const out = {};
  Object.keys(old).forEach(id => {
    const o = old[id];
    if (o && o.best !== "" && o.best !== undefined && o.best !== null) {
      out[id] = { history: [ { value: o.best, date: o.date || todayStr(), notes: o.notes || "" } ] };
    }
  });
  return out;
}

let currentLevel = 1;
let openRows = {};

function todayStr() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getHistory(id) {
  return (state[id] && state[id].history) ? state[id].history : [];
}

function bestOf(history, assistedOnly) {
  let best = null;
  history.forEach(h => {
    if (assistedOnly !== undefined && !!h.assisted !== assistedOnly) return;
    const n = Number(h.value);
    if (!Number.isNaN(n)) {
      if (best === null || n > best) best = n;
    }
  });
  return best;
}

function computeStatus(ex, history) {
  if (!history.length) return { cls: "empty", label: "\u2014" };
  const bestUnassisted = bestOf(history, false);
  const assistedEntries = history.filter(h => h.assisted);

  if (ex.target === null || ex.target === undefined) {
    const hasUnassisted = history.some(h => !h.assisted && h.value !== "" && h.value !== undefined && h.value !== null);
    if (hasUnassisted) return { cls: "yes", label: "Yes" };
    if (assistedEntries.length) return { cls: "progress", label: "In progress" };
    return { cls: "bad", label: "Check entry" };
  }

  if (bestUnassisted !== null && bestUnassisted >= ex.target) return { cls: "yes", label: "Yes" };
  if (assistedEntries.length) return { cls: "progress", label: "In progress" };

  const unassistedEntries = history.filter(h => !h.assisted);
  if (unassistedEntries.length && bestUnassisted === null) return { cls: "bad", label: "Check entry" };
  if (bestUnassisted !== null) return { cls: "not-yet", label: "Not yet" };
  return { cls: "empty", label: "\u2014" };
}

function levelExercises(level) {
  return EXERCISES.filter(e => e.level === level);
}

function renderLevelNav() {
  const nav = document.getElementById("levelNav");
  nav.innerHTML = "";
  for (let lvl = 1; lvl <= 8; lvl++) {
    const btn = document.createElement("button");
    btn.style.setProperty("--dotcolor", LEVEL_COLORS[lvl]);
    if (lvl === currentLevel) btn.classList.add("active");
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = LEVEL_COLORS[lvl];
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode("Level " + lvl));
    btn.addEventListener("click", () => { currentLevel = lvl; renderAll(); });
    nav.appendChild(btn);
  }
}

function fmtDate(d) {
  if (!d) return "";
  const parts = d.split("-");
  if (parts.length !== 3) return d;
  return parts[1] + "/" + parts[2] + "/" + parts[0].slice(2);
}

function renderHistoryList(container, ex) {
  container.innerHTML = "";
  const history = getHistory(ex.id).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  if (!history.length) {
    const empty = document.createElement("div");
    empty.className = "history-empty";
    empty.textContent = "No results logged yet.";
    container.appendChild(empty);
    return;
  }
  history.forEach((h) => {
    const realIndex = getHistory(ex.id).indexOf(h);
    const item = document.createElement("div");
    item.className = "history-item";

    const dateEl = document.createElement("span");
    dateEl.className = "h-date";
    dateEl.textContent = fmtDate(h.date);
    item.appendChild(dateEl);

    const valEl = document.createElement("span");
    const n = Number(h.value);
    const bestForType = bestOf(getHistory(ex.id), !!h.assisted);
    const isBest = !Number.isNaN(n) && bestForType !== null && n === bestForType;
    valEl.className = "h-val" + (isBest ? " h-best" : "");
    valEl.textContent = h.value + (ex.unit ? " " + ex.unit : "");
    item.appendChild(valEl);

    const notesEl = document.createElement("span");
    notesEl.className = "h-notes";
    if (h.assisted) {
      const tag = document.createElement("span");
      tag.className = "h-tag";
      tag.textContent = "Assisted" + (h.assistedWith ? ": " + h.assistedWith : "");
      notesEl.appendChild(tag);
    }
    if (h.notes) {
      const notesText = document.createElement("span");
      notesText.className = "h-notes-text";
      notesText.textContent = h.notes;
      notesEl.appendChild(notesText);
    }
    item.appendChild(notesEl);

    const delBtn = document.createElement("button");
    delBtn.textContent = "\u2715";
    delBtn.title = "Delete entry";
    delBtn.addEventListener("click", () => {
      const hist = getHistory(ex.id);
      hist.splice(realIndex, 1);
      state[ex.id] = { history: hist };
      saveState();
      refreshRow(ex);
    });
    item.appendChild(delBtn);

    container.appendChild(item);
  });
}

function refreshRow(ex) {
  const row = document.querySelector('.ex-row[data-id="' + ex.id + '"]');
  if (!row) return;
  const history = getHistory(ex.id);
  const status = computeStatus(ex, history);
  const pill = row.querySelector(".status-pill");
  pill.className = "status-pill " + status.cls;
  pill.textContent = status.label;

  const target = row.querySelector(".ex-target");
  target.innerHTML = targetHtml(ex, history);

  const histContainer = row.querySelector(".history-list");
  if (histContainer) renderHistoryList(histContainer, ex);

  renderProgress();
}

function targetHtml(ex, history) {
  const bestUnassisted = bestOf(history, false);
  const bestAssisted = bestOf(history, true);
  const goalPart = (ex.target !== null && ex.target !== undefined)
    ? "Goal: " + ex.target + " " + ex.unit
    : "Goal: pass/fail";
  let extra = "";
  if (bestUnassisted !== null) {
    extra += " &middot; Best: <b>" + bestUnassisted + (ex.unit ? " " + ex.unit : "") + "</b>";
  }
  if (bestAssisted !== null) {
    extra += " &middot; Assisted best: <b class=\"assisted-best\">" + bestAssisted + (ex.unit ? " " + ex.unit : "") + "</b>";
  }
  return goalPart + extra;
}

function exRow(ex) {
  const history = getHistory(ex.id);
  const status = computeStatus(ex, history);

  const row = document.createElement("div");
  row.className = "ex-row" + (openRows[ex.id] ? " open" : "");
  row.dataset.id = ex.id;
  row.style.setProperty("--rowcolor", LEVEL_COLORS[ex.level]);

  const main = document.createElement("div");
  main.className = "ex-main";
  main.addEventListener("click", () => {
    row.classList.toggle("open");
    openRows[ex.id] = row.classList.contains("open");
  });

  const iconWrap = document.createElement("div");
  iconWrap.innerHTML = ICONS[ex.icon] || ICONS.generic;
  main.appendChild(iconWrap);

  const textWrap = document.createElement("div");
  const t = document.createElement("div");
  t.className = "ex-text";
  t.textContent = ex.text;
  textWrap.appendChild(t);
  const target = document.createElement("div");
  target.className = "ex-target";
  target.innerHTML = targetHtml(ex, history);
  textWrap.appendChild(target);
  main.appendChild(textWrap);

  const controls = document.createElement("div");
  controls.className = "ex-controls";
  const pill = document.createElement("span");
  pill.className = "status-pill " + status.cls;
  pill.textContent = status.label;
  controls.appendChild(pill);
  const caret = document.createElement("span");
  caret.className = "ex-caret";
  caret.textContent = "\u25BE";
  controls.appendChild(caret);
  main.appendChild(controls);

  row.appendChild(main);

  const more = document.createElement("div");
  more.className = "ex-more";

  const form = document.createElement("div");
  form.className = "log-form";

  const valField = document.createElement("div");
  valField.className = "log-field value";
  valField.innerHTML = '<label>Result (' + (ex.unit || "n/a") + ')</label>';
  const valInput = document.createElement("input");
  valInput.type = "number";
  valInput.inputMode = "decimal";
  valField.appendChild(valInput);
  form.appendChild(valField);

  const dateField = document.createElement("div");
  dateField.className = "log-field date";
  dateField.innerHTML = '<label>Date</label>';
  const dateInput = document.createElement("input");
  dateInput.type = "date";
  dateInput.value = todayStr();
  dateField.appendChild(dateInput);
  form.appendChild(dateField);

  const notesField = document.createElement("div");
  notesField.className = "log-field notes";
  notesField.innerHTML = '<label>Notes (optional)</label>';
  const notesInput = document.createElement("input");
  notesInput.type = "text";
  notesInput.placeholder = "Form cues, etc...";
  notesField.appendChild(notesInput);
  form.appendChild(notesField);

  const assistedField = document.createElement("div");
  assistedField.className = "log-field assisted";
  const assistedCheckbox = document.createElement("input");
  assistedCheckbox.type = "checkbox";
  assistedCheckbox.id = "assisted-" + ex.id;
  const assistedLabel = document.createElement("label");
  assistedLabel.setAttribute("for", assistedCheckbox.id);
  assistedLabel.textContent = "Assisted";
  assistedField.appendChild(assistedCheckbox);
  assistedField.appendChild(assistedLabel);
  form.appendChild(assistedField);

  const assistedWithField = document.createElement("div");
  assistedWithField.className = "log-field notes";
  assistedWithField.innerHTML = '<label>Assisted with (optional)</label>';
  const assistedWithInput = document.createElement("input");
  assistedWithInput.type = "text";
  assistedWithInput.placeholder = "e.g. yellow band";
  assistedWithField.appendChild(assistedWithInput);
  form.appendChild(assistedWithField);

  const addBtn = document.createElement("button");
  addBtn.textContent = "Add";
  addBtn.type = "button";
  addBtn.addEventListener("click", () => {
    if (valInput.value === "") { valInput.focus(); return; }
    const hist = getHistory(ex.id);
    hist.push({
      value: valInput.value,
      date: dateInput.value || todayStr(),
      notes: notesInput.value,
      assisted: assistedCheckbox.checked,
      assistedWith: assistedCheckbox.checked ? assistedWithInput.value : ""
    });
    state[ex.id] = { history: hist };
    saveState();
    valInput.value = "";
    notesInput.value = "";
    dateInput.value = todayStr();
    assistedCheckbox.checked = false;
    assistedWithInput.value = "";
    refreshRow(ex);
  });
  form.appendChild(addBtn);

  more.appendChild(form);

  const histTitle = document.createElement("div");
  histTitle.className = "history-title";
  histTitle.textContent = "History (most recent first)";
  more.appendChild(histTitle);

  const histList = document.createElement("div");
  histList.className = "history-list";
  more.appendChild(histList);

  row.appendChild(more);
  renderHistoryList(histList, ex);

  return row;
}

function renderProgress() {
  let totalAll = EXERCISES.length, doneAll = 0;
  EXERCISES.forEach(ex => {
    const st = computeStatus(ex, getHistory(ex.id));
    if (st.cls === "yes") doneAll++;
  });
  document.getElementById("overallText").textContent =
    doneAll + " / " + totalAll + " goals achieved across all levels";
  document.getElementById("overallFill").style.width =
    (totalAll ? (100 * doneAll / totalAll) : 0) + "%";

  const exs = levelExercises(currentLevel);
  let done = 0;
  exs.forEach(ex => {
    const st = computeStatus(ex, getHistory(ex.id));
    if (st.cls === "yes") done++;
  });
  const lp = document.getElementById("levelProgressText");
  if (lp) lp.innerHTML = "<b>" + done + " / " + exs.length + "</b> goals achieved in Level " + currentLevel;
}

function renderAll() {
  renderLevelNav();
  const app = document.getElementById("app");
  app.innerHTML = "";

  const progressLine = document.createElement("div");
  progressLine.className = "level-progress";
  progressLine.innerHTML = '<span id="levelProgressText"></span>';
  app.appendChild(progressLine);

  const exs = levelExercises(currentLevel);
  ["Conditioning", "Skills"].forEach(cat => {
    const items = exs.filter(e => e.category === cat);
    if (!items.length) return;
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = cat;
    app.appendChild(title);
    items.forEach(ex => app.appendChild(exRow(ex)));
  });

  renderProgress();
}

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "calisthenics-log-backup.json";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("fileInput").click();
});

document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      // detect old flat format vs new history format
      let looksOld = false;
      Object.values(imported || {}).some(v => {
        if (v && typeof v === "object" && "best" in v) { looksOld = true; return true; }
        return false;
      });
      state = looksOld ? migrateOldState(imported) : (imported || {});
      saveState();
      renderAll();
    } catch (err) {
      alert("Couldn't read that file - make sure it's a backup exported from this app.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Clear all logged history? This can't be undone.")) {
    state = {};
    saveState();
    renderAll();
  }
});

renderAll();
</script>
